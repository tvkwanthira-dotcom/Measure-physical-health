<title>Latest Run – Stats Screen</title>

<style>
  :root {
    --ink: #000000;
    --ink-soft: #333333;
    --line: #D2D2D2;
    --accent: #FF6666;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #ECECEC;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px 0;
    font-family: 'Inter', sans-serif;
  }

  .screen-wrapper {
    width: 390px;
    height: 693.33px;
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0px 10px 40px rgba(0,0,0,0.15);
  }

  .screen {
    width: 1080px;
    height: 1920px;
    position: relative;
    background: #ffffff;
    overflow: hidden;
    border-radius: 8px;
    transform: scale(0.36111);
    transform-origin: top left;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    width: 1080px;
    height: 120.59px;
    position: absolute;
    left: 0; top: 0;
    background: #ffffff;
    box-shadow: 0px 4px 50px rgba(0,0,0,0.10);
    border-bottom-left-radius: 50px;
    border-bottom-right-radius: 50px;
    outline: 2px solid var(--line);
  }

  .label {
    position: absolute;
    display: flex;
    align-items: center;
    color: var(--ink-soft);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    white-space: nowrap;
  }

  .value {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font-family: 'Nova Square', sans-serif;
    font-weight: 400;
    text-align: center;
    white-space: nowrap;
  }

  .run-date {
    left: 395px; top: 31px;
    font-size: 40px;
    line-height: 60px;
  }

  .latest-run-label {
    left: 69px; top: 29px;
    font-size: 45px;
    line-height: 67.5px;
  }

  /* ---------- Hero black card (map / activity area) ---------- */
  .activity-card {
    width: 950px;
    height: 950px;
    position: absolute;
    left: 72px; top: 678px;
    background: #000000;
    box-shadow: 0px 4px 50px rgba(0,0,0,0.10);
    border-radius: 30px;
    outline: 2px solid var(--line);
  }

  .duration-label { left: 443px; top: 230px; font-size: 40px; line-height: 60px; }
  .duration-value {
    width: 503px; left: 296px; top: 256px;
    font-size: 100px; line-height: 150px;
  }

  .pace-label    { left: 182px; top: 553px; font-size: 30px; line-height: 45px; }
  .pace-value    { width: 214px; left: 114px; top: 397px; font-size: 70px; line-height: 105px; }

  .distance-label{ left: 432px; top: 553px; font-size: 30px; line-height: 45px; }
  .distance-value{ width: 214px; left: 440px; top: 397px; font-size: 70px; line-height: 105px; }

  .kcal-label    { left: 833px; top: 553px; font-size: 30px; line-height: 45px; }
  .kcal-value    { width: 214px; left: 766px; top: 397px; font-size: 70px; line-height: 105px; }

  .more-link     { left: 864px; top: 624px; font-size: 30px; line-height: 45px; cursor: pointer; }

  /* ---------- Heart-rate gauge ---------- */
  .hr-gauge {
    width: 300px; height: 300px;
    position: absolute;
    left: 662px; top: 1266px;
    background: #ffffff;
    border-radius: 9999px;
    box-shadow: 0px 4px 50px rgba(0,0,0,0.10);
    outline: 7px solid var(--line);
  }

  .hr-fill {
    width: 258.33px; height: 260px;
    position: absolute;
    left: 677.61px; top: 1286px;
    background: var(--accent);
    border-radius: 9999px;
  }

  .hr-inner {
    width: 210px; height: 210px;
    position: absolute;
    left: 701.775px; top: 1311px;
    background: #ffffff;
    border-radius: 9999px;
  }

  .hr-label-bg {
    width: 130px; height: 81px;
    position: absolute;
    left: 747px; top: 1284px;
    background: #ffffff;
  }

  .hr-heading {
    width: 170px; height: 74px;
    position: absolute;
    left: 727px; top: 1291px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 24px;
    line-height: 34px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .bpm-value {
    width: 214px; left: 705px; top: 1371px;
    font-size: 60px; line-height: 90px;
  }

  .bpm-label {
    width: 118px; height: 92px;
    position: absolute;
    left: 753px; top: 1425px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 22px;
    line-height: 33px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- Bottom nav ---------- */
  .bottom-nav {
    width: 1000px; height: 170px;
    position: absolute;
    left: 47px; top: 1700px;
    background: #ffffff;
    box-shadow: 0px 4px 50px rgba(0,0,0,0.10);
    border-radius: 30px;
    outline: 2px solid var(--line);
  }

  .nav-icon {
    position: absolute;
    object-fit: contain;
  }

  /* Order left to right: Team, Home, Running, Stats, Profile */
  .nav-icon--1 { width: 87.5px; height: 75px;  left: 140.25px; top: 1747.51px; }   /* Team */
  .nav-icon--2 { width: 81.13px; height: 99.84px; left: 325px; top: 1735px; }      /* Home */
  .nav-icon--3 { width: 75px; height: 79.16px; left: 509.5px; top: 1743.35px; }    /* Running */
  .nav-icon--4 { width: 91.67px; height: 91.67px; left: 692.17px; top: 1739.17px; }/* Stats */
  .nav-icon--5 { width: 75px; height: 75px; left: 891.5px; top: 1747.5px; }        /* Profile */

</style>
